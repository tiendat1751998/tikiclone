# Nginx TLS + Performance Configuration for 10K+ TPS
# Optimized for high-throughput reverse proxy with upstream keepalive pooling
# Proxy cache zone for Next.js SSR pages
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:100m max_size=2g inactive=60m;

upstream gateway_backend {
    server gateway:8080;
    server gateway-2:8080;
    server gateway-3:8080;
    keepalive 512;
    keepalive_requests 100000;
    keepalive_timeout 300s;
}

upstream web_backend {
    server web:3000;
    server web-2:3000;
    server web-3:3000;
    keepalive 128;
    keepalive_requests 100000;
    keepalive_timeout 300s;
}

server {
    listen 3000;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# HTTP endpoint for high-throughput internal access (no TLS overhead)
server {
    listen 8888;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    proxy_buffering off;
    proxy_buffer_size 4k;
    proxy_connect_timeout 1s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;

    # API gateway (no TLS)
    location /api/ {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location / {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}

# HTTPS endpoint with optimized TLS
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:80m;
    ssl_session_timeout 120m;
    ssl_session_tickets on;
    ssl_prefer_server_ciphers off;
    ssl_buffer_size 4k;
    ssl_early_data on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s;

    proxy_buffering off;
    proxy_buffer_size 4k;
    tcp_nodelay on;
    proxy_connect_timeout 1s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;

    # API gateway (all /api/ traffic)
    location /api/ {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 16k;
    }

    # Next.js frontend with proxy cache
    location / {
        proxy_cache my_cache;
        proxy_cache_valid 200 120s;
        proxy_cache_valid 404 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;

        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}