      APP_ENV: development
      HTTP_PORT: "8089"
      MYSQL_HOST: "10.10.10.200"
      MYSQL_PORT: "3306"
      MYSQL_USER: "tiki"
      MYSQL_PASSWORD: "tiki_dev"
      MYSQL_DATABASE: tiki_platform
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8089/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
