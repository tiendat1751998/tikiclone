      MYSQL_PORT: "3306"
      MYSQL_USER: "tiki"
      MYSQL_PASSWORD: "tiki_dev"
      MYSQL_DATABASE: tiki_platform
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: "mongodb://10.10.10.201:27017"
      MONGODB_DATABASE: tiki_catalog
