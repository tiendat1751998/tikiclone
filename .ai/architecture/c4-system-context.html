<style>

    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .diagram-container {
    max-width: 1400px;
    width: 100%;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 40px;
    margin-bottom: 32px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);

  .subtitle { font-size: 12px; color: #64748b; margin-bottom: 32px; }
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  .dot.cyan { background: #22d3ee; box-shadow: 0 0 8px #22d3ee88; }
  .dot.emerald { background: #34d399; box-shadow: 0 0 8px #34d39988; }
  .dot.violet { background: #a78bfa; box-shadow: 0 0 8px #a78bfa88; }
  .dot.amber { background: #fbbf24; box-shadow: 0 0 8px #fbbf2488; }
  .dot.orange { background: #fb923c; box-shadow: 0 0 8px #fb923c88; }
  .dot.rose { background: #fb7185; box-shadow: 0 0 8px #fb718588; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  svg { width: 100%; height: auto; display: block; }
  .legend { margin-top: 12px; padding-top: 16px; border-top: 1px solid #1e293b; }
  .legend-title { font-size: 10px; color: #64748b; margin-bottom: 8px; }
  .legend-items { display: flex; gap: 24px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #94a3b8; }
  .legend-swatch {
    width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid;
  }
  .legend-swatch.cyan { background: rgba(8,51,68,0.4); border-color: #22d3ee; }
  .legend-swatch.emerald { background: rgba(6,78,59,0.4); border-color: #34d399; }

  .legend-swatch.rose { background: rgba(136,19,55,0.4); border-color: #fb7185; }
  .legend-swatch.slate { background: rgba(30,41,59,0.5); border-color: #94a3b8; }
